replicaCount: 2
image:
  repository: "294747659026.dkr.ecr.us-east-1.amazonaws.com/sample-nodejs" # set to ECR URI by terraform output / CI
  tag: "v1.0.0"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: true
  className: nginx # k3d/local default; EKS uses values-eks.yaml (alb)
  host: "app.example.com" # override with your domain
  annotations: {}
  tls:
    enabled: false # controller-level TLS via a Secret (k3d/nginx); ALB terminates ACM itself
    certArn: "" # ACM cert ARN -> alb.ingress.kubernetes.io/certificate-arn (EKS)
    secretName: "" # defaults to <release>-tls when tls.enabled and no certArn
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
config:
  port: "8080"
podDisruptionBudget:
  enabled: true
  minAvailable: 1
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
probes:
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    path: /live
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
